[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platformer-lab"
version = "0.1.0"
description = "An AI-native platformer, reinforcement-learning environment, and procedural-content laboratory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5,<3",
]

[project.optional-dependencies]
training = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "stable-baselines3>=2.4",
    "torch>=2.2",
]
deployment = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["ai_platformer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
